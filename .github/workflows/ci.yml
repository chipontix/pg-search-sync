name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./... && go vet -tags integration ./...
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Pipeline against PostgreSQL, Redpanda and Elasticsearch (Testcontainers)
        run: go test -race -tags integration -count=1 -timeout 15m ./internal/pipeline/

  e2e-stove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - name: Stove e2e against the cmd/all binary (built with -race)
        working-directory: e2e
        run: ./gradlew --no-daemon test
